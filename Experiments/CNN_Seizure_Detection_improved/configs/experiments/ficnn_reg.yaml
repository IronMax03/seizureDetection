# Experiment: regularised FiLM-CNN (dropout in blocks + FiLM generator + classifier)
model: ficnn_reg
preprocess: raw
features: apen
data_fraction: 0.5

tune:
  n_trials: 20
  n_folds: 3
  n_epochs: 10
  tune:
    search:
      lr: {low: 1.0e-5, high: 1.0e-2, log: true}            # any value in the range
      weight_decay: {low: 1.0e-6, high: 1.0e-2, log: true}
      batch_size: [32, 64, 128, 256, 512]   