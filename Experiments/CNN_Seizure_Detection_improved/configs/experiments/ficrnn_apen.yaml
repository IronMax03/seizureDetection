# Experiment: FiLM-CRNN conditioned on ApEn features, raw EEG
# sequence_len controls how many consecutive windows the RNN sees per sequence.
# 32 windows = 32 seconds of context (at 1s windows / 256 Hz).
model: ficrnn
preprocess: raw
features: apen
sequence_len: 32
data_fraction: 0.5

tune:
  n_trials: 8
  n_folds: 1
  n_epochs: 10
  search:
    lr: [1.0e-4, 5.0e-4, 1.0e-3, 3.0e-3]
    weight_decay: [0.0, 1.0e-4, 1.0e-3]
    batch_size: [32, 64, 128]   # batch_size = number of sequences (not windows)
