# Experiment: FiLM-CRNN conditioned on ApEn features, raw EEG
# sequence_len controls how many consecutive windows the RNN sees per sequence.
# 32 windows = 32 seconds of context (at 1s windows / 256 Hz).
model: ficrnn
preprocess: raw
features: apen
sequence_len: 32

data_fraction: 0.75

tune:
  n_trials: 15
  n_folds: 3
  n_epochs: 10
  tune:
    search:
      lr: {low: 1.0e-5, high: 1.0e-2, log: true}            # any value in the range
      weight_decay: {low: 1.0e-6, high: 1.0e-2, log: true}
      batch_size: [64, 128, 256]   