# Experiment: FiLM-CNN without conditioning (control), raw EEG
model: ficrnn
preprocess: raw
features: none
sequence_len: 32

data_fraction: 0.75

tune:
  n_trials: 15
  n_folds: 3
  n_epochs: 10
  tune:
    search:
      lr: {low: 1.0e-5, high: 1.0e-2, log: true}            # any value in the range
      weight_decay: {low: 1.0e-6, high: 1.0e-2, log: true}
      batch_size: [64, 128, 256]   